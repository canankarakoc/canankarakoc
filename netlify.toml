# Netlify builds the site with Quarto on every push.
# Quarto and Pillow (for resizing illustrations) come from requirements.txt.

[build]
  command = "pip install -r requirements.txt && quarto render"
  publish = "_site"

[build.environment]
  PYTHON_VERSION = "3.12"
  # The site does not use Node.js; pinning a current version only silences
  # Netlify's warning about the old Node 16 default.
  NODE_VERSION = "22"
