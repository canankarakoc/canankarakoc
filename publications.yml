- title: Evolutionary bioenergetics of sporulation
  authors: Karakoç C, Shoemaker WR, Lennon JT
  journal: Proceedings of the National Academy of Sciences
  details: "123(6): e2524274123"
  year: 2026
  doi: 10.1073/pnas.2524274123
  code: https://github.com/LennonLab/cost_of_spore
  abstract: >-
    Energy is required for the expression and maintenance of complex traits. In
    many habitats, however, free energy available to support biosynthesis is in
    vanishingly short supply. As a result, many taxa have evolved persistence
    strategies that support survival in unfavorable environments. Among these is
    sporulation, an ancient bacterial program governed by a large genetic
    network that requires energy for both regulation and execution. Yet
    sporulation is a last resort, initiated when cellular energy is nearly
    exhausted. To resolve this paradox, we quantified the energetic cost of
    sporulation in units of ATP by integrating time-resolved genome,
    transcriptome, and proteome profiles. The full cost of the spore cycle,
    including both formation and revival, ranks among the most energy-intensive
    processes in the bacterial cell, requiring almost 10<sup>10</sup> ATP and
    consuming about 10% of the total energy budget. The majority of this cost
    arises from translation, membrane synthesis, and protein turnover. Despite
    its considerable upfront investment, sporulation enables long-term survival
    and becomes optimal when harsh conditions extend over timescales of months
    or longer. This trade-off between immediate cost and delayed benefit helps
    explain when sporulation is maintained or replaced by alternative
    strategies. By incorporating our estimates into mechanistic models, we show
    how metabolic constraints shape sporulation efficiency, while genome-wide
    mutation accumulation data reveal that even modest energetic burdens can
    become visible to selection, influencing the evolutionary fate of this
    complex and widespread trait.

- title: A practical guide to characterising ecological coexistence
  authors: Clark AT, Shoemaker LG, Arnoldi J-F, Barabás G, Germain R, Godoy O, Hallett L, Karakoç C, Saavedra S, Schreiber SJ
  journal: Biological Reviews
  details: "101(1): 195–220"
  year: 2026
  doi: 10.1111/brv.70079
  abstract: >-
    Coexistence is simultaneously one of the most fundamental concepts of
    ecology, and one of the most difficult to define. A particular challenge is
    that, despite a well-developed body of research, several different schools
    of thought have developed over the past century, leading to multiple
    independent, and largely isolated, branches of literature with distinct
    methodologies. Here, we provide a broad overview of the most common concepts
    and metrics currently used to detect and characterise ecological
    coexistence. We first introduce four classes of behaviour, which jointly
    describe the ways in which community dynamics can unfold: (i) the existence
    of a feasible steady state (or invariant set), i.e. where all coexisting
    species retain positive abundances in the long-term in the absence of
    interference by external forces; (ii) the existence of a local attractor
    that draws the community towards a feasible steady state from within a
    restricted set of starting conditions; (iii) the existence of a global
    attractor that draws the community towards feasible steady states from any
    non-zero starting condition; and (o) a null transient state, where species
    abundances vary over time irrespective of steady states and attractors.
    Next, we explain how these classes of behaviour relate to commonly used
    metrics for identifying and characterising coexistence, including analyses
    of parameter sensitivity, asymptotic return rates, invasion growth rates,
    and time to extinction. We then discuss the scope and limitations of each of
    these behavioural classes and corresponding metrics, with a particular focus
    on applications in empirical systems. Finally, we provide a potential
    workflow for matching empirical questions to theoretical tools, and present
    a brief prospectus looking forward to opportunities for advancing and
    integrating research on coexistence.

