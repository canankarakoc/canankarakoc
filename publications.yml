- title: Relationships of temperature and biodiversity with stability of natural aquatic food webs
  authors: Zhao Q, Van den Brink PJ, Xu C, Wang S, Clark AT, Karakoç C, Sugihara G, Widdicombe CE, Atkinson A, Matsuzaki SS, Shinohara R, He S, Wang YXG, De Laender F
  journal: Nature Communications
  details: "14: 3507"
  year: 2023
  doi: 10.1038/s41467-023-38977-6
  abstract: >-
    Temperature and biodiversity changes occur in concert, but their joint
    effects on ecological stability of natural food webs are unknown. Here, we
    assess these relationships in 19 planktonic food webs. We estimate stability
    as structural stability (using the volume contraction rate) and temporal
    stability (using the temporal variation of species abundances). Warmer
    temperatures were associated with lower structural and temporal stability,
    while biodiversity had no consistent effects on either stability property.
    While species richness was associated with lower structural stability and
    higher temporal stability, Simpson diversity was associated with higher
    temporal stability. The responses of structural stability were linked to
    disproportionate contributions from two trophic groups (predators and
    consumers), while the responses of temporal stability were linked both to
    synchrony of all species within the food web and distinctive contributions
    from three trophic groups (predators, consumers, and producers). Our results
    suggest that, in natural ecosystems, warmer temperatures can erode ecosystem
    stability, while biodiversity changes may not have consistent effects.

