- title: General statistical scaling laws for stability in ecological systems
  authors: Clark AT, Arnoldi J-F, Zelnik YR, Barabás G, Hodapp D, Karakoç C, König S, Radchuk V, Donohue I, Huth A, Jacquet C, de Mazancourt C, Mentges A, Nothaaß D, Shoemaker LG, Taubert F, Wiegand T, Wang S, Chase JM, Loreau M, Harpole S
  journal: Ecology Letters
  details: "24(7): 1474–1486"
  year: 2021
  doi: 10.1111/ele.13760
  abstract: >-
    Ecological stability refers to a family of concepts used to describe how
    systems of interacting species vary through time and respond to
    disturbances. Because observed ecological stability depends on sampling
    scales and environmental context, it is notoriously difficult to compare
    measurements across sites and systems. Here, we apply stochastic dynamical
    systems theory to derive general statistical scaling relationships across
    time, space, and ecological level of organisation for three fundamental
    stability aspects: resilience, resistance, and invariance. These
    relationships can be calibrated using random or representative samples
    measured at individual scales, and projected to predict average stability at
    other scales across a wide range of contexts. Moreover deviations between
    observed vs. extrapolated scaling relationships can reveal information about
    unobserved heterogeneity across time, space, or species. We anticipate that
    these methods will be useful for cross-study synthesis of stability data,
    extrapolating measurements to unobserved scales, and identifying underlying
    causes and consequences of heterogeneity.

